name: ci

on:
  push:
  pull_request:

jobs:
  typescript:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
      - run: npm install
      - run: npm test

  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32v1-none
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p acuris-provenance-contract
      - run: cargo build -p acuris-provenance-contract --target wasm32v1-none --release

# web/ (the live Testnet demo) deploys via Vercel's own GitHub integration, not this workflow —
# see web/vercel.json (Root Directory = "web" in the Vercel project; installCommand/buildCommand
# there use `npm install/run --prefix=..` to reach the workspace root's package.json and sibling
# packages/ from inside Root Directory) and web/README.md. Vercel builds and deploys
# independently on every push once the repo is imported.
