[package]
name = "acuris-provenance-contract"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk = "27.0.6"

[dev-dependencies]
soroban-sdk = { version = "27.0.6", features = ["testutils"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
unicode-normalization = "0.1"
sha2 = "0.10"

# [profile.release] lives in the workspace root Cargo.toml — Cargo only honors profiles
# declared there, and silently ignores them here.
